name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: gnmyflow-macos-arm64
            archive_name: gnmyflow-macos-arm64.tar.gz
            binary_name: gnmyflow
            alias_name: sw
          - os: ubuntu-latest
            artifact_name: gnmyflow-linux-x86_64
            archive_name: gnmyflow-linux-x86_64.tar.gz
            binary_name: gnmyflow
            alias_name: sw
          - os: windows-latest
            artifact_name: gnmyflow-windows-x86_64
            archive_name: gnmyflow-windows-x86_64.zip
            binary_name: gnmyflow.exe
            alias_name: sw.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build Standalone Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --clean -y --onefile --collect-all playwright --collect-all studiowright --name gnmyflow scripts/gnmyflow_cli.py
          chmod +x dist/gnmyflow
          ./dist/gnmyflow --version
          cp dist/gnmyflow dist/sw
          tar -czf ${{ matrix.archive_name }} -C dist gnmyflow sw
          cp dist/gnmyflow ${{ matrix.artifact_name }}

      - name: Build Standalone Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean -y --onefile --collect-all playwright --collect-all studiowright --name gnmyflow scripts/gnmyflow_cli.py
          .\dist\gnmyflow.exe --version
          copy dist\gnmyflow.exe dist\sw.exe
          7z a ${{ matrix.archive_name }} .\dist\gnmyflow.exe .\dist\sw.exe
          copy dist\gnmyflow.exe ${{ matrix.artifact_name }}.exe

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.artifact_name }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Publish archive checksums
        run: |
          cd dist-release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
